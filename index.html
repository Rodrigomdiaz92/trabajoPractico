<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MeteoApp</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🌤️ Weather Dashboard</h1>
            <p>Consulta el pronóstico del tiempo en tiempo real.</p>
        </header>

        <section class="search-section">
            <input type="text" id="cityInput" placeholder="Ej: Buenos Aires, Panama, Madrid..." />
            <button id="searchBtn">🔍 Buscar</button>
        </section>

        <div id="loading" class="hidden">Cargando datos meteorológicos...</div>
        <div id="error" class="hidden"></div>

        <main id="weatherResult" class="weather-card hidden">
            <h2 id="cityName">-</h2>
            <div class="temp-container">
                <span id="temperature">--</span>°C
            </div>
            <div class="details-grid">
                <div class="detail-item">
                    <span>💨 Viento</span>
                    <strong id="windspeed">-- km/h</strong>
                </div>
                <div class="detail-item">
                    <span>💧 Humedad</span>
                    <strong id="humidity">-- %</strong>
                </div>
                <div class="detail-item">
                    <span>📍 Lat/Lon</span>
                    <strong id="coordinates">--</strong>
                </div>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
